name: print_easy
description: "طباعة سريعة — تطبيق طباعة متقدم للطابعات الحرارية المحمولة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_blue_plus: ^1.32.0
  usb_serial: ^0.5.1
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  pdfx: ^2.6.0
  image: ^4.1.7
  csv: ^6.0.0
  excel: ^4.0.3
  qr_flutter: ^4.1.0
  barcode: ^2.2.8
  receive_sharing_intent: ^1.8.0
  intl: any
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/templates/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
